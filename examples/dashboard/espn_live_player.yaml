# Dynamic live-player board using Mushroom + auto-entities.
#
# Requirements:
# - Mushroom cards installed through HACS
# - auto-entities installed through HACS
#
# The integration creates one Game Active binary sensor per rostered player.
# auto-entities watches those sensors and creates a Mushroom card only for
# players whose Game Active sensor is currently on. The card disappears when
# the player leaves ESPN live scoring.

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Live Now
    subtitle: Players currently in an NFL game

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - entity_id: "binary_sensor.espn_fantasy_*_game_active"
          state: "on"
          options:
            type: custom:mushroom-template-card
            entity: this.entity_id
            picture: >-
              {% set p = states.sensor
                | selectattr('attributes.player_id', 'eq', state_attr(entity, 'player_id'))
                | list | first %}
              {{ p.attributes.headshot if p else none }}
            primary: >-
              {% set p = states.sensor
                | selectattr('attributes.player_id', 'eq', state_attr(entity, 'player_id'))
                | list | first %}
              {{ p.attributes.friendly_name if p else state_attr(entity, 'friendly_name') }}
            secondary: >-
              {% set p = states.sensor
                | selectattr('attributes.player_id', 'eq', state_attr(entity, 'player_id'))
                | list | first %}
              {% if p %}
                {{ p.attributes.position }} · {{ p.attributes.nfl_team }}
                {% if p.attributes.opponent %} · vs {{ p.attributes.opponent }}{% endif %}
                · {{ '%.2f' | format(p.state | float(0)) }} pts
              {% endif %}
            badge_icon: mdi:circle
            badge_text: LIVE
            badge_color: red
            tap_action:
              action: more-info
    show_empty: false
