# ESPN-style roster board using Mushroom + auto-entities.
#
# Requirements:
# - Mushroom cards installed through HACS
# - auto-entities installed through HACS
#
# The card discovers every ESPN player sensor automatically. Starters are
# grouped in roster-slot order, followed by bench and IR. No player entity IDs
# need to be maintained manually.

 type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: My Fantasy Team
    subtitle: ESPN Fantasy Football

  - type: custom:mushroom-title-card
    title: Starting Lineup

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: QB
          options: &player_card
            type: custom:mushroom-template-card
            entity: this.entity_id
            picture: "{{ state_attr(entity, 'headshot') }}"
            primary: "{{ state_attr(entity, 'friendly_name') }}"
            secondary: >-
              {{ state_attr(entity, 'position') }} · {{ state_attr(entity, 'nfl_team') }}
              {% if state_attr(entity, 'opponent') %} · vs {{ state_attr(entity, 'opponent') }}{% endif %}
              {% if state_attr(entity, 'injury_status') and state_attr(entity, 'injury_status') != 'NORMAL' %}
              · {{ state_attr(entity, 'injury_status') }}{% endif %}
            badge_icon: >-
              {% if state_attr(entity, 'live_points') is not none %}mdi:circle{% endif %}
            badge_text: >-
              {% if state_attr(entity, 'live_points') is not none %}LIVE{% endif %}
            badge_color: red
            tap_action:
              action: more-info
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: RB
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: WR
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: TE
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: FLEX
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: K
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: D/ST
          options: *player_card
    sort:
      method: name
      ignore_case: true

  - type: custom:mushroom-title-card
    title: Bench & IR

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: Bench
          options: *player_card
        - domain: sensor
          attributes:
            player_id: "*"
            roster_slot: IR
          options: *player_card
    sort:
      method: name
      ignore_case: true
    show_empty: false
