name: Frontend validation

on:
  push:
    paths:
      - "custom_components/espn_fantasy/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "custom_components/espn_fantasy/**"
      - ".github/workflows/frontend.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        run: node --check custom_components/espn_fantasy/www/espn-fantasy-cards.js
      - name: Check Python syntax
        run: python -m compileall -q custom_components/espn_fantasy
      - name: Check frontend and integration versions match
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("custom_components/espn_fantasy")
          manifest_version = json.loads((root / "manifest.json").read_text())["version"]
          js = (root / "www/espn-fantasy-cards.js").read_text()
          init = (root / "__init__.py").read_text()
          js_version = re.search(r'CARD_VERSION\s*=\s*"([^"]+)"', js).group(1)
          assert manifest_version == js_version, (
              f"Version mismatch: manifest={manifest_version}, frontend={js_version}"
          )
          assert '_CARD_VERSION = json.loads(_MANIFEST_PATH.read_text' in init
          assert '_CARD_URL = f"{_CARD_STATIC_URL}?v={_CARD_VERSION}"' in init
          print(f"Manifest/frontend/cache version source is consistent: {manifest_version}")
          PY
      - name: Check required card registrations
        run: |
          FILE=custom_components/espn_fantasy/www/espn-fantasy-cards.js
          grep -q 'class ESPNFantasyPlayerCard' "$FILE"
          grep -q 'class ESPNFantasyTickerCard' "$FILE"
          grep -q 'class ESPNFantasyTeamCard' "$FILE"
          grep -q 'class ESPNFantasyMatchupCard' "$FILE"
          grep -q 'class ESPNFantasyLeagueCard' "$FILE"
          grep -q 'class ESPNFantasyLeagueTickerCard' "$FILE"
          grep -q 'class ESPNFantasyNewsCard' "$FILE"
          grep -q '"espn-fantasy-player-card",ESPNFantasyPlayerCard' "$FILE"
          grep -q '"espn-fantasy-player-ticker-card",ESPNFantasyTickerCard' "$FILE"
          grep -q '"espn-fantasy-team-card",ESPNFantasyTeamCard' "$FILE"
          grep -q '"espn-fantasy-matchup-card",ESPNFantasyMatchupCard' "$FILE"
          grep -q '"espn-fantasy-league-card",ESPNFantasyLeagueCard' "$FILE"
          grep -q '"espn-fantasy-league-ticker-card",ESPNFantasyLeagueTickerCard' "$FILE"
          grep -q '"espn-fantasy-news-card",ESPNFantasyNewsCard' "$FILE"
          grep -q 'window.customCards' "$FILE"
