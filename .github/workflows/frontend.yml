name: Frontend validation

on:
  push:
    paths:
      - "custom_components/espn_fantasy/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "custom_components/espn_fantasy/**"
      - ".github/workflows/frontend.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        run: node --check custom_components/espn_fantasy/www/espn-fantasy-cards.js
      - name: Check Python syntax
        run: python -m compileall -q custom_components/espn_fantasy
      - name: Check frontend and integration versions match
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("custom_components/espn_fantasy")
          manifest_version = json.loads((root / "manifest.json").read_text())["version"]
          js = (root / "www/espn-fantasy-cards.js").read_text()
          init = (root / "__init__.py").read_text()
          js_version = re.search(r'CARD_VERSION\s*=\s*"([^"]+)"', js).group(1)
          assert manifest_version == js_version, (
              f"Version mismatch: manifest={manifest_version}, frontend={js_version}"
          )
          assert '_CARD_VERSION = json.loads(_MANIFEST_PATH.read_text' in init
          assert '_CARD_URL = f"{_CARD_STATIC_URL}?v={_CARD_VERSION}"' in init
          print(f"Manifest/frontend/cache version source is consistent: {manifest_version}")
          PY
      - name: Smoke-test normalized league scoreboard
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("custom_components/espn_fantasy/model.py")
          spec = importlib.util.spec_from_file_location("espn_fantasy_model", path)
          model = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(model)

          data = {
              "scoringPeriodId": 4,
              "status": {"currentScoringPeriod": 4, "currentMatchupPeriod": 4},
              "teams": [
                  {"id": 1, "name": "Alpha", "record": {"overall": {"wins": 3, "losses": 0}}},
                  {"id": 2, "name": "Beta", "record": {"overall": {"wins": 2, "losses": 1}}},
              ],
              "current_matchup": [{
                  "id": 99,
                  "matchupPeriodId": 4,
                  "home": {"teamId": 1, "totalPoints": 101.5, "rosterForCurrentScoringPeriod": {"entries": []}},
                  "away": {"teamId": 2, "totalPoints": 98.2, "rosterForCurrentScoringPeriod": {"entries": []}},
              }],
              "pro_team_schedules": [],
          }
          normalized = model.build_normalized_model(data, 1)
          scoreboard = normalized["league"]["scoreboard"]
          assert len(scoreboard) == 1
          assert scoreboard[0]["home_team_name"] == "Alpha"
          assert scoreboard[0]["away_team_name"] == "Beta"
          PY
      - name: Smoke-test schedule and playoff bracket normalization
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("custom_components/espn_fantasy/model.py")
          spec = importlib.util.spec_from_file_location("espn_fantasy_model", path)
          model = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(model)

          teams = [
              {"id": 1, "name": "Alpha", "playoffSeed": 1, "record": {"overall": {"wins": 4, "losses": 0}}},
              {"id": 2, "name": "Beta", "playoffSeed": 2, "record": {"overall": {"wins": 3, "losses": 1}}},
              {"id": 3, "name": "Gamma", "playoffSeed": 3, "record": {"overall": {"wins": 2, "losses": 2}}},
              {"id": 4, "name": "Delta", "playoffSeed": 4, "record": {"overall": {"wins": 1, "losses": 3}}},
          ]
          data = {
              "scoringPeriodId": 4,
              "status": {"currentScoringPeriod": 4, "currentMatchupPeriod": 4},
              "settings": {"scheduleSettings": {"playoffTeamCount": 4}},
              "teams": teams,
              "season_schedule": [
                  {"id": 1, "matchupPeriodId": 4, "home": {"teamId": 1, "totalPoints": 99}, "away": {"teamId": 2, "totalPoints": 95}},
                  {"id": 20, "matchupPeriodId": 15, "playoffTierType": "WINNERS_BRACKET", "home": {"teamId": 1}, "away": {"teamId": 4}},
                  {"id": 21, "matchupPeriodId": 15, "playoffTierType": "WINNERS_BRACKET", "home": {"teamId": 2}, "away": {"teamId": 3}},
                  {"id": 22, "matchupPeriodId": 16, "playoffTierType": "WINNERS_BRACKET", "home": {}, "away": {}},
              ],
              "current_matchup": [{"id": 1, "matchupPeriodId": 4, "home": {"teamId": 1, "rosterForCurrentScoringPeriod": {"entries": []}}, "away": {"teamId": 2, "rosterForCurrentScoringPeriod": {"entries": []}}}],
              "pro_team_schedules": [],
          }
          league = model.build_normalized_model(data, 1)["league"]
          assert league["schedule_periods"] == [4, 15, 16]
          assert len(league["schedule"]) == 4
          bracket = league["playoff_bracket"]
          assert bracket["available"] is True
          assert bracket["source"] == "espn_schedule"
          assert bracket["projected"] is True
          assert [r["label"] for r in bracket["rounds"]] == ["Semifinals", "Championship"]
          assert bracket["rounds"][0]["matches"][0]["home_seed"] == 1
          assert bracket["sections"][0]["tier"] == "WINNERS_BRACKET"

          postseason = dict(data)
          postseason["season_schedule"] = [
              *data["season_schedule"],
              {"id": 30, "matchupPeriodId": 15, "playoffTierType": "LOSERS_BRACKET", "home": {"teamId": 3}, "away": {"teamId": 4}},
              {"id": 31, "matchupPeriodId": 16, "playoffTierType": "CONSOLATION_LADDER", "home": {"teamId": 3}, "away": {"teamId": 4}},
          ]
          full_bracket = model.build_normalized_model(postseason, 1)["league"]["playoff_bracket"]
          assert [section["tier"] for section in full_bracket["sections"]] == [
              "WINNERS_BRACKET", "LOSERS_BRACKET", "CONSOLATION_LADDER"
          ]

          fallback = dict(data)
          fallback["season_schedule"] = []
          projected = model.build_normalized_model(fallback, 1)["league"]["playoff_bracket"]
          assert projected["available"] is True
          assert projected["source"] == "standings_projection"
          assert projected["projected"] is True
          assert projected["rounds"][0]["matches"][0]["home_seed"] == 1

          # Reproduce a 10-team traditional-waiver league where ESPN carries a
          # dormant acquisitionBudget=100 and the consolation ladder is enabled.
          diagnostic = dict(data)
          diagnostic["teams"] = [
              {"id": i, "name": f"Team {i}", "playoffSeed": i, "waiverRank": i,
               "transactionCounter": {"acquisitionBudgetSpent": 0},
               "record": {"overall": {"wins": 10-i, "losses": i-1}}}
              for i in range(1, 11)
          ]
          diagnostic["season_schedule"] = []
          diagnostic["settings"] = {
              "scheduleSettings": {
                  "playoffTeamCount": 4,
                  "consolationLadderDisabled": False,
                  "matchupPeriodCount": 13,
                  "matchupPeriods": {"14": [14, 15], "15": [16, 17]},
              },
              "acquisitionSettings": {
                  "acquisitionType": "WAIVERS_TRADITIONAL",
                  "isUsingAcquisitionBudget": False,
                  "acquisitionBudget": 100,
              },
          }
          normalized = model.build_normalized_model(diagnostic, 1)["league"]
          assert [section["tier"] for section in normalized["playoff_bracket"]["sections"]] == [
              "WINNERS_BRACKET", "CONSOLATION_LADDER"
          ]
          assert normalized["playoff_bracket"]["sections"][1]["rounds"][0]["matches"]
          assert normalized["waivers"]["system"] == "waiver_order"
          assert normalized["waivers"]["acquisition_budget"] is None
          assert all(item["budget_remaining"] is None for item in normalized["waivers"]["order"])
          assert all(item["budget_spent"] is None for item in normalized["waivers"]["order"])
          PY
      - name: Smoke-test history and lineup advice
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("custom_components/espn_fantasy/model.py")
          spec = importlib.util.spec_from_file_location("espn_fantasy_model", path)
          model = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(model)

          history = [
              {"week": 3, "actual_points": 18.0},
              {"week": 2, "actual_points": 12.0},
          ]
          summary = model._season_summary(history)
          assert summary["weeks_with_stats"] == 2
          assert summary["total_points"] == 30.0
          assert summary["average_points"] == 15.0

          players = [
              {"id": 1, "name": "Starter", "starter": True, "lineup_slot_id": 2, "projected_points": 10.0},
              {"id": 2, "name": "Bench", "starter": False, "lineup_slot_id": 20, "eligible_slot_ids": [2, 23], "projected_points": 14.5},
              {"id": 3, "name": "Wrong Slot", "starter": False, "lineup_slot_id": 20, "eligible_slot_ids": [0], "projected_points": 25.0},
          ]
          model._apply_lineup_advice(players)
          assert players[0]["lineup_alert"] == "lower_than_bench"
          assert players[0]["lineup_alert_player_id"] == 2
          assert players[0]["lineup_alert_difference"] == 4.5
          assert players[1]["lineup_alert"] == "higher_than_starter"
          assert players[2]["lineup_alert"] is None
          PY
      - name: Smoke-test canonical roster enrichment
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("custom_components/espn_fantasy/model.py")
          spec = importlib.util.spec_from_file_location("espn_fantasy_model", path)
          model = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(model)

          def stat(week, source, points):
              return {
                  "seasonId": 2026, "scoringPeriodId": week,
                  "statSourceId": source, "statSplitTypeId": 1,
                  "appliedTotal": points, "stats": {"24": week * 10},
              }

          canonical_player = {
              "id": 101, "fullName": "History Player", "defaultPositionId": 2,
              "proTeamId": 1, "eligibleSlots": [2, 20],
              "injuryStatus": "QUESTIONABLE", "injured": True,
              "stats": [
                  stat(1, 0, 11.0), stat(1, 1, 10.0),
                  stat(2, 0, 12.0), stat(2, 1, 11.0),
                  stat(3, 0, 13.0), stat(3, 1, 12.0),
                  stat(4, 1, 14.0),
              ],
          }
          matchup_player = {
              "id": 101, "fullName": "History Player", "defaultPositionId": 2,
              "proTeamId": 1, "eligibleSlots": [2, 20],
              "stats": [stat(4, 1, 15.0)],
          }
          canonical_entry = {
              "playerId": 101, "lineupSlotId": 20,
              "playerPoolEntry": {"id": 101, "player": canonical_player},
          }
          matchup_entry = {
              "playerId": 101, "lineupSlotId": 2,
              "playerPoolEntry": {"id": 101, "player": matchup_player},
          }
          data = {
              "scoringPeriodId": 4,
              "status": {"currentScoringPeriod": 4, "currentMatchupPeriod": 4},
              "teams": [
                  {"id": 1, "name": "Alpha", "roster": {"entries": [canonical_entry]}},
                  {"id": 2, "name": "Beta", "roster": {"entries": []}},
              ],
              "current_matchup": [{
                  "id": 99, "matchupPeriodId": 4,
                  "home": {"teamId": 1, "rosterForCurrentScoringPeriod": {"entries": [matchup_entry]}},
                  "away": {"teamId": 2, "rosterForCurrentScoringPeriod": {"entries": []}},
              }],
              "pro_team_schedules": [],
          }
          normalized = model.build_normalized_model(data, 1)
          player = normalized["matchup"]["my_team"]["roster"][0]
          assert player["lineup_slot_id"] == 2
          assert player["injury_status"] == "QUESTIONABLE"
          assert player["injured"] is True
          assert [row["week"] for row in player["weekly_history"]] == [4, 3, 2, 1]
          assert player["weekly_history"][0]["projected_points"] == 15.0
          assert player["season_summary"]["weeks_with_stats"] == 3
          assert player["season_summary"]["total_points"] == 36.0
          PY
      - name: Smoke-test normalized league activity
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("custom_components/espn_fantasy/model.py")
          spec = importlib.util.spec_from_file_location("espn_fantasy_model", path)
          model = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(model)

          player_a = {"id": 101, "fullName": "Dropped Player", "defaultPositionId": 3, "proTeamId": 1, "stats": []}
          player_b = {"id": 202, "fullName": "Added Player", "defaultPositionId": 2, "proTeamId": 2, "stats": []}
          data = {
              "scoringPeriodId": 4,
              "status": {"currentScoringPeriod": 4, "currentMatchupPeriod": 4},
              "teams": [
                  {"id": 1, "name": "Alpha", "logo": "alpha.png", "roster": {"entries": []}},
                  {"id": 2, "name": "Beta", "logo": "beta.png", "roster": {"entries": []}},
              ],
              "current_matchup": [],
              "pro_team_schedules": [{"id": 1, "abbrev": "ATL"}, {"id": 2, "abbrev": "BUF"}],
              "transaction_players": {101: player_a, 202: player_b},
              "transactions": [{
                  "id": 9, "type": "WAIVER", "teamId": 1, "status": "EXECUTED", "processDate": 123,
                  "items": [
                      {"type": "DROP", "playerId": 101, "fromTeamId": 1},
                      {"type": "ADD", "playerId": 202, "toTeamId": 1},
                  ],
              }],
          }
          normalized = model.build_normalized_model(data, 1)
          event = normalized["league"]["activity"][0]
          assert event["team_name"] == "Alpha"
          assert event["team_logo"] == "alpha.png"
          assert event["is_trade"] is False
          assert event["items"][0]["player"]["name"] == "Dropped Player"
          assert event["items"][1]["player"]["name"] == "Added Player"
          assert event["sides"][0]["team_name"] == "Alpha"

          data["transactions"] = [{
              "id": 10, "type": "TRADE", "status": "EXECUTED", "processDate": 124,
              "items": [
                  {"type": "TRADE", "playerId": 101, "fromTeamId": 1, "toTeamId": 2},
                  {"type": "TRADE", "playerId": 202, "fromTeamId": 2, "toTeamId": 1},
              ],
          }]
          event = model.build_normalized_model(data, 1)["league"]["activity"][0]
          assert event["is_trade"] is True
          assert len(event["sides"]) == 2
          assert {side["team_name"] for side in event["sides"]} == {"Alpha", "Beta"}
          assert all(side["sent"] and side["received"] for side in event["sides"])
          PY
      - name: Run compatibility fixture tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Check adaptive live polling path
        run: |
          grep -q 'LIVE_SCAN_INTERVAL = 60' custom_components/espn_fantasy/const.py
          grep -q 'get_live_matchup' custom_components/espn_fantasy/api.py
          grep -q '_matchup_has_live_players' custom_components/espn_fantasy/coordinator.py
          grep -q 'now - self._last_full_refresh < DEFAULT_SCAN_INTERVAL' custom_components/espn_fantasy/coordinator.py

      - name: Check automation-facing sensors
        run: |
          FILE=custom_components/espn_fantasy/sensor.py
          grep -q 'class LeagueActivitySensor' "$FILE"
          grep -q 'class LineupRecommendationsSensor' "$FILE"
          grep -q 'class InjuredPlayersSensor' "$FILE"
          grep -q '"recent_activity"' "$FILE"
          grep -q '"recommendations"' "$FILE"
          grep -q '"has_injuries"' "$FILE"
      - name: Check required card registrations
        run: |
          FILE=custom_components/espn_fantasy/www/espn-fantasy-cards.js
          grep -q 'class ESPNFantasyPlayerCard' "$FILE"
          grep -q 'class ESPNFantasyTickerCard' "$FILE"
          grep -q 'class ESPNFantasyTeamCard' "$FILE"
          grep -q 'class ESPNFantasyMatchupCard' "$FILE"
          grep -q 'class ESPNFantasyLeagueCard' "$FILE"
          grep -q 'class ESPNFantasyLeagueTickerCard' "$FILE"
          grep -q 'class ESPNFantasyNewsCard' "$FILE"
          grep -q '"espn-fantasy-player-card",ESPNFantasyPlayerCard' "$FILE"
          grep -q '"espn-fantasy-player-ticker-card",ESPNFantasyTickerCard' "$FILE"
          grep -q '"espn-fantasy-team-card",ESPNFantasyTeamCard' "$FILE"
          grep -q '"espn-fantasy-matchup-card",ESPNFantasyMatchupCard' "$FILE"
          grep -q '"espn-fantasy-league-card",ESPNFantasyLeagueCard' "$FILE"
          grep -q '"espn-fantasy-league-ticker-card",ESPNFantasyLeagueTickerCard' "$FILE"
          grep -q 'class ESPNFantasyUnifiedTickerCard' "$FILE"
          grep -q '"espn-fantasy-ticker-card",ESPNFantasyUnifiedTickerCard' "$FILE"
          grep -q 'section_roster:true' "$FILE"
          grep -q 'section_schedule:true' "$FILE"
          grep -q 'section_bracket:true' "$FILE"
          grep -q 'ticker_players:true' "$FILE"
          grep -q 'ticker_scoreboard:true' "$FILE"
          grep -q 'ticker_activity:true' "$FILE"
          grep -q 'Bench / IR' "$FILE"
          grep -q 'data-roster="starters"' "$FILE"
          grep -q 'ticker_section_1' "$FILE"
          grep -q 'Sections & Order' "$FILE"
          grep -q 'class ESPNFantasyTickerEditor' "$FILE"
          grep -q 'Playoff Bracket' "$FILE"
          grep -q 'data-expand-bracket' "$FILE"
          grep -q 'scheduleBody' "$FILE"
          grep -q 'data-schedule-view="league"' "$FILE"
          grep -q 'data-schedule-view="team"' "$FILE"
          grep -q 'aria-label="Previous week"' "$FILE"
          grep -q 'mdi:arrow-expand-all' "$FILE"
          grep -q 'bracket.sections' "$FILE"
          ! grep -q 'data-bracket-round' "$FILE"
          grep -q 'scroll_style' "$FILE"
          grep -q 'Smooth / continuous' "$FILE"
          grep -q 'ticker-identity' "$FILE"
          grep -q 'ESPN_FANTASY_ICON' "$FILE"
          grep -q 'header_background_color' "$FILE"
          grep -q 'class ESPNFantasyLeagueEditor' "$FILE"
          grep -q 'news_height' "$FILE"
          grep -q 'data-news-player' "$FILE"
          grep -q 'bindTickerPlayers' "$FILE"
          grep -q 'injuryBadge(p)' "$FILE"
          grep -q 'Historical stats' "$FILE"
          grep -q 'lineup_alert_threshold' "$FILE"
          grep -q 'lineup-advice' "$FILE"
          grep -q '"espn-fantasy-news-card",ESPNFantasyNewsCard' "$FILE"
          grep -q 'window.customCards' "$FILE"
