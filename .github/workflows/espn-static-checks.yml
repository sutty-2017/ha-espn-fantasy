name: ESPN static regression checks
on:
  pull_request:
    paths:
      - 'custom_components/espn_fantasy/**'
      - '.github/workflows/espn-static-checks.yml'
      - 'tests/**'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python integration
        run: python -m compileall -q custom_components/espn_fantasy
      - name: Run all integration regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: node --check custom_components/espn_fantasy/www/espn-fantasy-cards.js
      - name: Test news and popup rendering without video
        run: node tests/test_frontend_no_video.js
      - name: Compare compact and legacy card rendering
        run: |
          python tests/benchmark_compact_transport.py --fixture /tmp/espn-compact-fixture.json
          node tests/test_compact_frontend.js /tmp/espn-compact-fixture.json
